 const sx0=Math.max(0,Math.floor(cam.x)-2),sy0=Math.max(0,Math.floor(cam.y)-2),sx1=Math.min(WW,Math.ceil(cam.x+vw)+2),sy1=Math.min(WH,Math.ceil(cam.y+vh)+2);
 const rw=sx1-sx0,rh=sy1-sy0;
 if(rw>0&&rh>0)g.drawImage(base,sx0,sy0,rw,rh,sx0,sy0,rw,rh);
 // buried things
 for(const c of cars){if(c.st===0)drawCar(g,c,1)}
 if(rw>0&&rh>0){g.globalAlpha=.95;g.drawImage(snowC,sx0,sy0,rw,rh,sx0,sy0,rw,rh);g.globalAlpha=1}
 // free cars on top
 for(const c of cars){if(c.st!==0)drawCar(g,c,c.t>2.2?Math.max(0,1-(c.t-2.2)):1)}
 // glints + SOS beacons
 for(const tr of treas){const a=.5+.5*Math.sin(t*4+tr.x);g.fillStyle=`rgba(255,240,160,${.25+a*.6})`;g.fillRect(tr.x-1.5,tr.y-8*a-2,3,16*a+4);g.fillRect(tr.x-8*a-2,tr.y-1.5,16*a+4,3)}
 for(const c of cars){if(c.st===0){const a=Math.sin(t*10+c.ph)>0,pol=c.type==='police';g.fillStyle=pol?(a?'#ff3b3b':'#3b6bff'):(a?'#ffb81f':'#ffe9a8');g.beginPath();g.arc(c.x,c.y-2,7,0,TAU);g.fill();
  g.strokeStyle=`rgba(255,200,60,${.7-((t*1.4+c.ph)%1)*.7})`;g.lineWidth=3;g.beginPath();g.arc(c.x,c.y,26+((t*1.4+c.ph)%1)*34,0,TAU);g.stroke()}}
 for(const b of boulders)drawBoulder(g,b);
 drawMelter(g,t);
 if(chest)drawChest(g,t);
 for(const p of picks)drawPickup(g,p,t);
 if(HELP)drawTruck(g,HELP,true);
 drawTruck(g,T,false);
 // trees
 for(const tr of trees){if(tr.x<cam.x-60||tr.x>cam.x+vw+60||tr.y<cam.y-80||tr.y>cam.y+vh+60)continue;g.save();g.translate(tr.x,tr.y+30);g.rotate(Math.sin(t*30+tr.ph)*.07*tr.sh+Math.sin(t*1.2+tr.ph)*.01);g.drawImage(treeC,-30,-66);g.restore()}
 // lamps + traffic lights
 for(const l of lamps){if(l.x<cam.x-40||l.x>cam.x+vw+40||l.y<cam.y-40||l.y>cam.y+vh+40)continue;
  g.fillStyle='#20252d';g.fillRect(l.x-2,l.y-2,4,4);
  if(l.tl){const ph=Math.floor(t/3+l.x*.01)%3;g.fillStyle='#14171d';g.fillRect(l.x-5,l.y-18,10,24);g.fillStyle=ph===0?'#ff3b3b':ph===1?'#ffcf2e':'#3bff6a';g.beginPath();g.arc(l.x,l.y-9+ph*6-6,3.2,0,TAU);g.fill()}
  else{g.fillStyle=city.night?'#fff1b0':'#c9d2de';g.beginPath();g.arc(l.x,l.y-10,4,0,TAU);g.fill()}}
 // particles
 for(const p of parts){const a=p.life/p.max;
  if(p.type==='steam'){g.fillStyle=`rgba(235,245,255,${a*.5})`;g.beginPath();g.arc(p.x,p.y,p.r*(2-a),0,TAU);g.fill()}
  else if(p.type==='flame'){g.fillStyle=a>.5?`rgba(120,220,255,${a})`:`rgba(255,170,70,${a})`;g.beginPath();g.arc(p.x,p.y,p.r*a+1,0,TAU);g.fill()}
  else{g.globalAlpha=Math.min(1,a*1.6);g.fillStyle=p.col;g.fillRect(p.x-p.r/2,p.y-p.r/2,p.r,p.r);g.globalAlpha=1}}
 // texts
 g.textAlign='center';g.lineJoin='round';
 for(const tx2 of texts){g.globalAlpha=Math.min(1,(1.4-tx2.t)*2);g.font=`900 ${tx2.size}px Impact,'Arial Black',sans-serif`;g.lineWidth=5;g.strokeStyle='#0a1626';g.strokeText(tx2.s,tx2.x,tx2.y);g.fillStyle=tx2.col;g.fillText(tx2.s,tx2.x,tx2.y)}
 g.globalAlpha=1;
 // screen space overlays
 g.setTransform(sc,0,0,sc,0,0);
 if(city.night){
  g.fillStyle='rgba(6,12,38,.5)';g.fillRect(0,0,W,H);g.globalCompositeOperation='lighter';
  const gl=(x,y,r,a)=>{g.globalAlpha=a;g.drawImage(glowC,w2sx(x)-r,w2sy(y)-r,r*2,r*2)};
  for(const l of lamps){if(!l.tl&&l.x>cam.x-130&&l.x<cam.x+vw+130&&l.y>cam.y-130&&l.y<cam.y+vh+130)gl(l.x,l.y-10,110*zoom,.7)}
  const c=Math.cos(T.a),s=Math.sin(T.a);gl(T.x+c*130,T.y+s*130,150*zoom,.8);gl(T.x+c*70,T.y+s*70,90*zoom,.9);gl(MEL.x,MEL.y,140*zoom,.8);
  if(HELP)gl(HELP.x+Math.cos(HELP.a)*80,HELP.y+Math.sin(HELP.a)*80,90*zoom,.6);
  g.globalAlpha=1;g.globalCompositeOperation='source-over';
 }
 if(R.chestT>0){g.fillStyle=`rgba(255,200,40,${.05+.04*Math.sin(t*8)})`;g.fillRect(0,0,W,H)}
 if(R.freezeT>0){g.fillStyle='rgba(120,200,255,.12)';g.fillRect(0,0,W,H);
  const gr=g.createRadialGradient(W/2,H/2,Math.min(W,H)*.35,W/2,H/2,Math.max(W,H)*.7);gr.addColorStop(0,'rgba(160,220,255,0)');gr.addColorStop(1,'rgba(160,220,255,.4)');g.fillStyle=gr;g.fillRect(0,0,W,H)}
 // falling snow
 if(R.freezeT<=0){
  const heavy=R.blizOn>0,n=Math.floor(flakes.length*Q*(heavy?1:.45));g.fillStyle=heavy?'rgba(255,255,255,.85)':'rgba(255,255,255,.7)';
  const wind=heavy?220:30,spd=heavy?380:60;
  for(let k=0;k<n;k++){const f=flakes[k];f.y+=(spd*f.s)*dtG/H;f.x+=(wind*f.s+Math.sin(t+f.d)*14)*dtG/W;if(f.y>1){f.y=-.02;f.x=rnd()}if(f.x>1)f.x=0;const sz=heavy?2.5*f.s+1:2*f.s+.6;g.fillRect(f.x*W,f.y*H,sz,sz)}
  if(heavy){g.fillStyle='rgba(225,238,252,.16)';g.fillRect(0,0,W,H)}
 }
 // flying coins
 for(const f of R.fly){const u=f.t/f.d,ex=60,ey=28,x=(1-u)*(1-u)*f.x+2*(1-u)*u*f.cx+u*u*ex,y=(1-u)*(1-u)*f.y+2*(1-u)*u*f.cy+u*u*ey;g.fillStyle='#ffcf2e';g.beginPath();g.arc(x,y,7,0,TAU);g.fill();g.strokeStyle='#b8830a';g.lineWidth=2;g.stroke()}
 drawArrow(g,t);
}
let dtG=.016;
function drawChest(g,t){
 g.save();g.translate(chest.x,chest.y-chest.z);
 if(chest.st===1){g.globalAlpha=.5+.3*Math.sin(t*6);g.drawImage(glowC,-60,-60,120,120);g.globalAlpha=1;g.translate(0,Math.sin(t*3)*3)}
 else{g.fillStyle='#fff';g.beginPath();g.arc(0,-46,40,PI,0);g.closePath();g.fill();g.strokeStyle='#ff8a1f';g.lineWidth=4;g.beginPath();g.moveTo(-40,-46);g.lineTo(-14,-6);g.moveTo(40,-46);g.lineTo(14,-6);g.moveTo(0,-86);g.lineTo(0,-6);g.stroke()}
 g.fillStyle='#8a4b0c';rr(g,-18,-12,36,24,4);g.fill();g.fillStyle='#ffc61a';g.fillRect(-18,-12,36,7);g.fillRect(-3,-12,6,24);g.strokeStyle='#5a2e00';g.lineWidth=2;rr(g,-18,-12,36,24,4);g.stroke();
 g.restore();
}
function drawArrow(g,t){
 let tg=null,col='#ffd23f';
 if(chest&&chest.st===1){tg=chest;col='#ffe27a'}
 else if(R.tank>=tankCap()*.9||(R.tank>20&&R.t>20&&cars.every(c=>c.st!==0)))tg=MEL;
 else if(R.t<30||R.rescued===0){let b=1e9;for(const c of cars)if(c.st===0){const d=Math.hypot(c.x-T.x,c.y-T.y);if(d<b){b=d;tg=c}}}
 if(!tg)return;
 const sx=w2sx(tg.x),sy=w2sy(tg.y),m=46;
 if(sx>m&&sx<W-m&&sy>m&&sy<H-m){if(tg===MEL||tg===chest||Math.hypot(tg.x-T.x,tg.y-T.y)<80)return;g.fillStyle=col;g.beginPath();const b=Math.sin(t*6)*5;g.moveTo(sx,sy-50+b);g.lineTo(sx-12,sy-70+b);g.lineTo(sx+12,sy-70+b);g.closePath();g.fill();return}
 const a=Math.atan2(sy-H/2,sx-W/2),ex=clamp(W/2+Math.cos(a)*W,m,W-m),ey=clamp(H/2+Math.sin(a)*H,m+60,H-m-60);
 g.save();g.translate(ex,ey);g.rotate(a);g.fillStyle=col;g.strokeStyle='#0a1626';g.lineWidth=3;g.beginPath();g.moveTo(16,0);g.lineTo(-10,-14);g.lineTo(-4,0);g.lineTo(-10,14);g.closePath();g.stroke();g.fill();g.restore();
}

/* ================= UI ================= */
function banner(s,ms){const e=$('banner');e.textContent=s;e.classList.remove('show');void e.offsetWidth;e.classList.add('show')}
function renderStatic(){
 const t=TX();$('bShop').textContent=W<640?'🛠':'🛠 '+t.shop;$('bCity').textContent=W<640?'🗺':'🗺 '+t.cities;$('bLang').textContent=S.lang==='ar'?'EN':'ع';$('bSnd').textContent=S.sound?'🔊':'🔇';
 document.documentElement.lang=S.lang;
 if(city)$('cityname').innerHTML=`<b>${CN[city.i][S.lang==='ar'?1:0]}</b> <small>${city.i+1}/50 · ${S.lang==='ar'?'':city.cc+' · '}x${city.mult.toFixed(1)}</small>`;
}
let hudT=0;
function updateHud(){
 const t=TX(),cap=tankCap(),pct=1-R.snowLeft/R.roadCells,goal=Math.min(100,pct/city.goal*100);
 $('mv').textContent=fmt(S.money);
 $('prog').firstElementChild.style.width=goal+'%';$('pt').textContent=`${t.cleared} ${Math.floor(pct*100)}% · 🚗 ${cars.filter(c=>c.st>0).length+R.rescued-cars.filter(c=>c.st>0).length}/${R.carsTotal}`;
 const tb=$('tankbar');tb.firstElementChild.style.width=R.tank/cap*100+'%';tb.lastElementChild.textContent=`${t.tank} ${Math.floor(R.tank)}/${cap}`;tb.classList.toggle('full',R.tank>=cap-.5);
 $('nitbar').firstElementChild.style.width=(R.chestT>0?100:R.nitro)+'%';$('nitbar').lastElementChild.textContent=t.nitro;
 const cb=$('chestbox');if(R.chestT>0){cb.style.display='block';cb.textContent='👑 '+t.chestOn+' '+Math.ceil(R.chestT)+'s'}else cb.style.display='none';
 const fz=$('bFreeze');if(L('freeze')>0){fz.style.display='block';fz.disabled=R.freezeCd>0||R.freezeT>0;fz.lastElementChild.textContent=R.freezeT>0?Math.ceil(R.freezeT):R.freezeCd>0?Math.ceil(R.freezeCd):''}else fz.style.display='none';
 const h=$('hint');let m='';if(R.tank>=cap-.5)m=t.tankFull;else if(R.t<9&&R.rescued===0)m=t.goal;else if(R.t<16&&R.rescued<2)m=t.goal2;
 if(m){h.style.display='block';h.textContent=m}else h.style.display='none';
}
function openModal(id){$(id).classList.add('open');setPaused(true)}
function closeModals(){document.querySelectorAll('.modal.open').forEach(m=>m.classList.remove('open'));setPaused(false)}
function setPaused(p){paused=p;try{if(window.PokiSDK){p?PokiSDK.gameplayStop():PokiSDK.gameplayStart()}}catch(e){}}
function openShop(){
 const t=TX();$('pShop').setAttribute('dir',S.lang==='ar'?'rtl':'ltr');
 let h=`<button class="x" id="shX">${t.close}</button><h2>${t.shop}</h2><div class="m2">$ ${fmt(S.money)}</div><div class="grid">`;
 UP.forEach(u=>{const l=L(u.id),mx=l>=MAXL,c=upCost(u),can=!mx&&S.money>=c;let pips='';for(let k=0;k<MAXL;k++)pips+=`<u class="${k<l?'on':''}"></u>`;
  h+=`<div class="card"><div class="ic">${u.ic}</div><div class="tx"><b>${t.up[u.id][0]} <span style="opacity:.6;font-weight:400">${t.lvl}${l}</span></b><small>${t.up[u.id][1]}</small><div class="pips">${pips}</div></div><button data-u="${u.id}" ${can?'':'disabled'}>${mx?t.max:'$'+fmt(c)}</button></div>`});
 h+='</div>';$('pShop').innerHTML=h;openModal('mShop');
}
function openCities(){
 const t=TX();$('pCity').setAttribute('dir',S.lang==='ar'?'rtl':'ltr');
 let h=`<button class="x" id="ctX">${t.close}</button><h2>${t.cities}</h2><div class="cgrid">`;
 for(let i=0;i<50;i++){const lock=i>S.maxCity;h+=`<button class="cb ${i===S.city?'cur':''} ${lock?'lock':''}" data-c="${i}" ${lock?'disabled':''}><b>${lock?'🔒':i+1}</b>${CN[i][S.lang==='ar'?1:0]}<small>x${(1+i*.4).toFixed(1)}</small></button>`}
 h+='</div>';$('pCity').innerHTML=h;openModal('mCity');
}
$('pShop').addEventListener('click',e=>{
 if(e.target.id==='shX'){closeModals();return}
 const b=e.target.closest('button[data-u]');if(!b)return;const u=UP.find(x=>x.id===b.dataset.u);if(!u)return;const c=upCost(u);
 if(L(u.id)>=MAXL||S.money<c)return;S.money-=c;S.up[u.id]++;sBuy();save();
 if(u.id==='helper'&&!HELP)spawnHelper();
 if(u.id==='tank')R.tank=Math.min(R.tank,tankCap());
 const sc=$('pShop').scrollTop;openShopKeep(sc);
});
function openShopKeep(sc){openShop();$('pShop').scrollTop=sc}
$('pCity').addEventListener('click',e=>{
 if(e.target.id==='ctX'){closeModals();return}
 const b=e.target.closest('button[data-c]');if(!b)return;sClick();closeModals();startCity(+b.dataset.c);
});
$('bShop').onclick=()=>{sClick();openShop()};
$('bCity').onclick=()=>{sClick();openCities()};
$('bLang').onclick=()=>{S.lang=S.lang==='ar'?'en':'ar';save();renderStatic();sClick()};
$('bSnd').onclick=()=>{S.sound=!S.sound;if(AU.m)AU.m.gain.value=S.sound?.55:0;renderStatic();save();auInit()};
$('bFreeze').addEventListener('pointerdown',e=>{e.preventDefault();useFreeze()});

/* ================= input ================= */
const keyMap={ArrowUp:'up',KeyW:'up',ArrowDown:'down',KeyS:'down',ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',Space:'space'};
addEventListener('keydown',e=>{auInit();const k=keyMap[e.code];if(k){K[k]=1;if(k==='space'||e.code.startsWith('Arrow'))e.preventDefault()}
 if(e.code==='KeyF'||e.code==='KeyE')useFreeze();if(e.code==='KeyU')paused?closeModals():openShop();if(e.code==='Escape')closeModals();if(e.code==='KeyM'){$('bSnd').click()}});
addEventListener('keyup',e=>{const k=keyMap[e.code];if(k)K[k]=0});
addEventListener('blur',()=>{for(const k in K)K[k]=0});
const jz=$('joyzone'),jb=$('jbase'),jk=$('jknob');
jz.addEventListener('pointerdown',e=>{auInit();if(joy.on)return;e.preventDefault();joy.on=true;joy.id=e.pointerId;joy.bx=e.clientX;joy.by=e.clientY;joy.mag=0;jz.setPointerCapture(e.pointerId);
 const r=jz.getBoundingClientRect();jb.style.left=(e.clientX-r.left)+'px';jb.style.top=(e.clientY-r.top)+'px';jb.style.display='block';jk.style.transform='translate(0,0)'});
jz.addEventListener('pointermove',e=>{if(!joy.on||e.pointerId!==joy.id)return;const dx=e.clientX-joy.bx,dy=e.clientY-joy.by,d=Math.hypot(dx,dy),m=60;joy.mag=Math.min(1,d/m);joy.ang=Math.atan2(dy,dx);const k=Math.min(d,m);jk.style.transform=`translate(${Math.cos(joy.ang)*k}px,${Math.sin(joy.ang)*k}px)`});
const joyEnd=e=>{if(e.pointerId!==joy.id)return;joy.on=false;joy.mag=0;jb.style.display='none'};
jz.addEventListener('pointerup',joyEnd);jz.addEventListener('pointercancel',joyEnd);jz.addEventListener('lostpointercapture',joyEnd);
const nb=$('bNitro');
nb.addEventListener('pointerdown',e=>{auInit();e.preventDefault();K.nitB=1;nb.classList.add('on');nb.setPointerCapture(e.pointerId)});
const nEnd=()=>{K.nitB=0;nb.classList.remove('on')};nb.addEventListener('pointerup',nEnd);nb.addEventListener('pointercancel',nEnd);
document.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('visibilitychange',()=>{if(document.hidden){if(AU.c)AU.c.suspend();save()}else{if(AU.c&&S.sound)AU.c.resume();lastT=performance.now()}});
document.querySelectorAll('.modal').forEach(m=>m.addEventListener('pointerdown',e=>{if(e.target===m&&m.id!=='mDone')closeModals()}));

/* ================= loop ================= */
function resize(){
 W=innerWidth;H=innerHeight;dpr=Math.min(devicePixelRatio||1,2)*Q;cv.width=Math.floor(W*dpr);cv.height=Math.floor(H*dpr);cv.style.width=W+'px';cv.style.height=H+'px';
 zoom=H>W?clamp(W/520,.62,1.1):clamp(Math.min(W/900,H/520),.55,1.25);if(city)renderStatic();
}
addEventListener('resize',resize);
let saveT=0,hudAcc=0,doneAcc=0;
function frame(now){
 requestAnimationFrame(frame);
 let dt=(now-lastT)/1000;lastT=now;if(!(dt>0))dt=.016;
 fpsEma+=(dt*1000-fpsEma)*.05;
 if(fpsEma>26&&Q>.6){slowN++;if(slowN>90){Q=Math.max(.6,Q-.15);slowN=0;fpsEma=16;resize()}}else slowN=0;
 dt=Math.min(dt,.05);dtG=dt;
 if(!paused&&!(R.done)){
  R.t+=dt;T.beac+=dt;
  const info=updateTruck(dt);
  updateCars(dt);updatePicks(dt);updateMelter(dt);updateEvents(dt);updateHelper(dt);updateParts(dt);
  auUpdate(T.v,info.vmax,info.nit,R.clrRate);
  hudAcc+=dt;if(hudAcc>.1){hudAcc=0;updateHud()}
  doneAcc+=dt;if(doneAcc>.5){doneAcc=0;checkDone()}
  saveT+=dt;if(saveT>5){saveT=0;save()}
 }else if(R.done&&!paused){updateParts(dt);updatePicks(dt);updateCars(dt)}
 else if(AU.c)auUpdate(0,300,false,0);
 render(now);
}

/* ================= init ================= */
resize();
startCity(clamp(S.city|0,0,Math.min(49,S.maxCity|0)));
renderStatic();updateHud();
lastT=performance.now();requestAnimationFrame(frame);
})();
</script>
